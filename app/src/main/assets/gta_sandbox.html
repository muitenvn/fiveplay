<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FivePlay 3D Los Santos Sandbox</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #070a12; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: #fff; }
  canvas#gameCanvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
  
  /* GTA HUD Overlay */
  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; }
  
  /* Top Bar */
  .hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .hud-stats { display: flex; flex-direction: column; gap: 4px; }
  .cash-display { font-size: 22px; font-weight: 900; color: #2ecc71; text-shadow: 0 0 8px rgba(46,204,113,0.6); letter-spacing: 1px; }
  .bars-row { display: flex; gap: 6px; align-items: center; margin-top: 2px; }
  .bar-container { width: 110px; height: 9px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.25); border-radius: 4px; overflow: hidden; }
  .bar-fill-health { width: 100%; height: 100%; background: linear-gradient(90deg, #e74c3c, #2ecc71); }
  .bar-fill-armor { width: 100%; height: 100%; background: linear-gradient(90deg, #2980b9, #00d2ff); }
  
  .weapon-card { background: rgba(10, 16, 30, 0.75); border: 1px solid rgba(0, 245, 212, 0.4); border-radius: 10px; padding: 6px 12px; backdrop-filter: blur(6px); display: flex; align-items: center; gap: 10px; }
  .weapon-name { font-size: 13px; font-weight: 800; color: #ffd166; text-transform: uppercase; }
  .weapon-ammo { font-size: 15px; font-weight: 900; color: #00f5d4; }
  
  .wanted-stars { display: flex; gap: 3px; font-size: 16px; color: #f39c12; text-shadow: 0 0 6px rgba(243,156,18,0.8); }
  .wanted-stars .inactive { color: rgba(255,255,255,0.2); text-shadow: none; }

  /* Notification banner */
  #toastMsg { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); border: 1px solid #00f5d4; border-radius: 20px; padding: 6px 16px; font-size: 13px; font-weight: 700; color: #00f5d4; box-shadow: 0 0 15px rgba(0,245,212,0.3); opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  
  /* Bottom HUD */
  .hud-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
  
  /* Mini Map */
  .minimap-box { width: 130px; height: 130px; border-radius: 50%; border: 2.5px solid #00f5d4; background: rgba(6,10,22,0.85); position: relative; overflow: hidden; box-shadow: 0 0 14px rgba(0,245,212,0.35); }
  #mapCanvas { width: 100%; height: 100%; }
  
  /* Speedometer */
  .speedo-box { display: flex; flex-direction: column; align-items: center; background: rgba(8,12,25,0.8); border: 1px solid rgba(255,209,102,0.4); border-radius: 14px; padding: 8px 14px; backdrop-filter: blur(8px); }
  .speed-num { font-size: 32px; font-weight: 900; color: #fff; line-height: 1; letter-spacing: -1px; }
  .speed-unit { font-size: 11px; font-weight: 800; color: #ffd166; letter-spacing: 1px; }
  .gear-tag { font-size: 11px; font-weight: 800; color: #00f5d4; margin-top: 2px; }

  /* In-game GTA Phone Mockup (Press Arrow Up to toggle) */
  #phoneModal { position: absolute; right: 20px; bottom: 80px; width: 220px; background: #0c1222; border: 2px solid #00f5d4; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: none; flex-direction: column; overflow: hidden; pointer-events: auto; z-index: 30; }
  .phone-header { background: #131d36; padding: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .phone-title { font-size: 12px; font-weight: 800; color: #00f5d4; }
  .phone-time { font-size: 11px; color: #ffd166; }
  .phone-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 12px; }
  .phone-app-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; color: #fff; font-size: 10px; font-weight: 700; }
  .phone-app-btn:active { background: rgba(0,245,212,0.25); border-color: #00f5d4; }
  .phone-app-icon { font-size: 18px; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- HUD Overlay -->
<div id="hud">
  <div class="hud-top">
    <div class="hud-stats">
      <div class="cash-display" id="cashVal">$1,250,000</div>
      <div class="bars-row">
        <div class="bar-container" title="Máu"><div class="bar-fill-health" id="healthBar"></div></div>
        <div class="bar-container" title="Giáp"><div class="bar-fill-armor" id="armorBar"></div></div>
      </div>
      <div class="wanted-stars" id="wantedStars">
        <span>★</span><span class="inactive">★</span><span class="inactive">★</span><span class="inactive">★</span><span class="inactive">★</span>
      </div>
    </div>
    
    <div class="weapon-card">
      <div>
        <div class="weapon-name" id="weapName">SÚNG PISTOL .50</div>
        <div style="font-size: 10px; color: rgba(255,255,255,0.6);" id="modeDesc">CHẾ ĐỘ: LÁI SIÊU XE</div>
      </div>
      <div class="weapon-ammo" id="ammoVal">∞</div>
    </div>
  </div>

  <div id="toastMsg">MÃ LỆNH: ĐÃ BẬT TỐC ĐỘ NITRO</div>

  <div class="hud-bottom">
    <div class="minimap-box">
      <canvas id="mapCanvas" width="130" height="130"></canvas>
    </div>
    
    <div class="speedo-box">
      <div class="speed-num" id="speedVal">0</div>
      <div class="speed-unit">KM / GIỜ</div>
      <div class="gear-tag" id="gearVal">SỐ 1 (ZENTORNO)</div>
    </div>
  </div>
</div>

<!-- Interactive GTA Phone Mockup -->
<div id="phoneModal">
  <div class="phone-header">
    <span class="phone-title">iFruit 15 Pro</span>
    <span class="phone-time" id="phoneClock">16:20</span>
  </div>
  <div class="phone-grid">
    <button class="phone-app-btn" onclick="applyCheat('nitro')">
      <span class="phone-app-icon">⚡</span>
      <span>Bơm Nitro</span>
    </button>
    <button class="phone-app-btn" onclick="applyCheat('car')">
      <span class="phone-app-icon">🏎️</span>
      <span>Đổi Siêu Xe</span>
    </button>
    <button class="phone-app-btn" onclick="applyCheat('heal')">
      <span class="phone-app-icon">🩹</span>
      <span>Hồi Máu / Giáp</span>
    </button>
    <button class="phone-app-btn" onclick="applyCheat('weather')">
      <span class="phone-app-icon">🌆</span>
      <span>Đổi Thời Tiết</span>
    </button>
    <button class="phone-app-btn" onclick="applyCheat('clear')">
      <span class="phone-app-icon">⭐</span>
      <span>Xóa Cảnh Sát</span>
    </button>
    <button class="phone-app-btn" onclick="toggleRadio()">
      <span class="phone-app-icon">📻</span>
      <span id="radioBtnLabel">Radio: Bật</span>
    </button>
  </div>
</div>

<script>
// --- Web Audio SFX Synthesizer ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let engineOsc = null;
let engineGain = null;
let radioRunning = false;
let radioInterval = null;

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new AudioCtx();
    // Engine sound loop
    engineOsc = audioCtx.createOscillator();
    engineGain = audioCtx.createGain();
    engineOsc.type = 'sawtooth';
    engineOsc.frequency.setValueAtTime(45, audioCtx.currentTime);
    engineGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
    engineOsc.connect(engineGain);
    engineGain.connect(audioCtx.destination);
    engineOsc.start();
  } catch (e) {}
}

function playGunshot() {
  if (!audioCtx) initAudio();
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(320, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.18);
    gain.gain.setValueAtTime(0.28, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.19);
  } catch(e) {}
}

function playHorn() {
  if (!audioCtx) initAudio();
  if (!audioCtx) return;
  try {
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc1.frequency.setValueAtTime(440, audioCtx.currentTime);
    osc2.frequency.setValueAtTime(554, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(audioCtx.destination);
    osc1.start();
    osc2.start();
    osc1.stop(audioCtx.currentTime + 0.35);
    osc2.stop(audioCtx.currentTime + 0.35);
  } catch (e) {}
}

function playDriftScreech() {
  if (!audioCtx) initAudio();
  if (!audioCtx) return;
  try {
    const node = audioCtx.createBufferSource();
    const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.12, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * 0.1;
    }
    node.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1800;
    node.connect(filter);
    filter.connect(audioCtx.destination);
    node.start();
  } catch(e) {}
}

function toggleRadio() {
  radioRunning = !radioRunning;
  document.getElementById('radioBtnLabel').innerText = radioRunning ? 'Radio: Đang Bật' : 'Radio: Tắt';
  showToast(radioRunning ? 'ĐÀI RADIO LOS SANTOS FM: ĐÃ BẬT' : 'ĐÀI RADIO: ĐÃ TẮT');
  if (radioRunning) {
    if (!audioCtx) initAudio();
    playRadioBeat();
  }
}

function playRadioBeat() {
  if (!radioRunning || !audioCtx) return;
  const chord = [220, 261, 329, 392, 440][Math.floor(Math.random() * 5)];
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(chord, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.45);
  setTimeout(playRadioBeat, 450);
}

// --- 3D Canvas Rendering Engine ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const mapCanvas = document.getElementById('mapCanvas');
const mapCtx = mapCanvas.getContext('2d');

let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
});

// Game World State
const state = {
  mode: 'CAR', // 'CAR' or 'FOOT'
  x: 0,
  z: 0,
  y: 0,
  angle: 0,
  speed: 0,
  steer: 0,
  gear: 1,
  headlights: true,
  health: 100,
  armor: 100,
  wanted: 1,
  weaponIdx: 0,
  weapons: ['Pistol .50', 'Micro SMG', 'Sniper Rifle', 'RPG Rocket', 'Sticky Bomb'],
  nitro: false,
  cameraMode: 0, // 0: Close, 1: Far, 2: Driver
  weather: 'SUNSET', // SUNSET, NIGHT, RAIN
  isAiming: false,
  bullets: [],
  skidmarks: [],
  sparks: [],
  phoneOpen: false
};

// Input state
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  initAudio();
  handleKeyAction(e.code, true);
});
window.addEventListener('keyup', e => {
  keys[e.code] = false;
  handleKeyAction(e.code, false);
});

function handleKeyAction(code, isDown) {
  if (!isDown) return;
  if (code === 'KeyF') {
    // Enter/Exit Vehicle
    state.mode = (state.mode === 'CAR') ? 'FOOT' : 'CAR';
    document.getElementById('modeDesc').innerText = 'CHẾ ĐỘ: ' + (state.mode === 'CAR' ? 'LÁI SIÊU XE' : 'ĐI BỘ / BẮN SÚNG');
    showToast(state.mode === 'CAR' ? 'ĐÃ LÊN XE ZENTORNO' : 'ĐÃ XUỐNG XE ĐI BỘ');
  } else if (code === 'KeyE') {
    playHorn();
    showToast('CÒI XE: BÍP BÍP!');
  } else if (code === 'KeyH') {
    state.headlights = !state.headlights;
    showToast(state.headlights ? 'ĐÈN PHA: ĐÃ BẬT' : 'ĐÈN PHA: ĐÃ TẮT');
  } else if (code === 'KeyV') {
    state.cameraMode = (state.cameraMode + 1) % 3;
    const camNames = ['GÓC NHÌN GẦN', 'GÓC NHÌN XA', 'GÓC NHÌN TÀI XẾ'];
    showToast('GÓC QUAY: ' + camNames[state.cameraMode]);
  } else if (code === 'KeyQ') {
    toggleRadio();
  } else if (code === 'ArrowUp') {
    togglePhone();
  } else if (code === 'Digit1') switchWeapon(0);
  else if (code === 'Digit2') switchWeapon(1);
  else if (code === 'Digit3') switchWeapon(2);
  else if (code === 'Digit4') switchWeapon(3);
  else if (code === 'Digit5') switchWeapon(4);
}

function switchWeapon(idx) {
  state.weaponIdx = idx % state.weapons.length;
  document.getElementById('weapName').innerText = state.weapons[state.weaponIdx].toUpperCase();
  showToast('ĐỔI VŨ KHÍ: ' + state.weapons[state.weaponIdx]);
}

function shootBullet() {
  playGunshot();
  const dirX = Math.sin(state.angle);
  const dirZ = Math.cos(state.angle);
  state.bullets.push({
    x: state.x,
    z: state.z,
    dx: dirX * 18,
    dz: dirZ * 18,
    life: 40
  });
  // Sparks
  for (let i = 0; i < 5; i++) {
    state.sparks.push({
      x: state.x + dirX * 5,
      z: state.z + dirZ * 5,
      dx: (Math.random() - 0.5) * 6,
      dz: (Math.random() - 0.5) * 6,
      life: 15
    });
  }
}

// Mouse events
canvas.addEventListener('mousedown', e => {
  initAudio();
  if (e.button === 0) {
    shootBullet();
  } else if (e.button === 2) {
    state.isAiming = true;
  }
});
canvas.addEventListener('mouseup', e => {
  if (e.button === 2) state.isAiming = false;
});
canvas.addEventListener('wheel', e => {
  if (e.deltaY < 0) switchWeapon(state.weaponIdx - 1 + state.weapons.length);
  else switchWeapon(state.weaponIdx + 1);
});

// Phone toggle
function togglePhone() {
  state.phoneOpen = !state.phoneOpen;
  document.getElementById('phoneModal').style.display = state.phoneOpen ? 'flex' : 'none';
}

function applyCheat(type) {
  if (type === 'nitro') {
    state.nitro = true;
    state.speed = Math.min(state.speed + 14, 45);
    showToast('MÃ LỆNH: ĐÃ KÍCH HOẠT NITRO TỐC ĐỘ CAO!');
  } else if (type === 'car') {
    state.x = 0; state.z = 0; state.speed = 0; state.angle = 0;
    state.mode = 'CAR';
    showToast('MÃ LỆNH: ĐÃ SPAWN SIÊU XE MỚI!');
  } else if (type === 'heal') {
    state.health = 100; state.armor = 100;
    document.getElementById('healthBar').style.width = '100%';
    document.getElementById('armorBar').style.width = '100%';
    showToast('MÃ LỆNH: ĐÃ HỒI ĐẦY 100% MÁU & GIÁP!');
  } else if (type === 'weather') {
    const list = ['SUNSET', 'NIGHT', 'RAIN'];
    const cur = list.indexOf(state.weather);
    state.weather = list[(cur + 1) % list.length];
    showToast('THỜI TIẾT: ' + state.weather);
  } else if (type === 'clear') {
    state.wanted = 0;
    updateWantedStars(0);
    showToast('MÃ LỆNH: ĐÃ XÓA SẠCH SAO TRUY NÃ!');
  }
  togglePhone();
}

function updateWantedStars(count) {
  const container = document.getElementById('wantedStars');
  container.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const span = document.createElement('span');
    span.innerText = '★';
    if (i >= count) span.className = 'inactive';
    container.appendChild(span);
  }
}

function showToast(text) {
  const toast = document.getElementById('toastMsg');
  toast.innerText = text;
  toast.style.opacity = '1';
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, 2200);
}

// 3D City Building Grid
const buildings = [];
for (let gx = -6; gx <= 6; gx++) {
  for (let gz = -6; gz <= 6; gz++) {
    if (Math.abs(gx) <= 1 && Math.abs(gz) <= 1) continue;
    if ((gx % 2 === 0) && (gz % 2 === 0)) {
      buildings.push({
        x: gx * 140,
        z: gz * 140,
        w: 80,
        d: 80,
        h: 90 + Math.abs(gx * gz * 7) % 180,
        color: ['#1e293b', '#0f172a', '#1e1b4b', '#2e1065'][Math.abs(gx + gz) % 4]
      });
    }
  }
}

// Main Render Loop
let lastFrameTime = performance.now();
let fpsCount = 0;
let fpsTimer = performance.now();

function gameLoop(now) {
  const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
  lastFrameTime = now;
  fpsCount++;
  if (now - fpsTimer >= 1000) {
    if (window.FivePlayNative && window.FivePlayNative.onFpsUpdate) {
      window.FivePlayNative.onFpsUpdate(fpsCount);
      window.FivePlayNative.onGameCanvasStatus(true);
    }
    fpsCount = 0;
    fpsTimer = now;
  }

  // --- Physics & Control Update ---
  if (state.mode === 'CAR') {
    const isW = keys['KeyW'] || keys['ArrowUp'];
    const isS = keys['KeyS'] || keys['ArrowDown'];
    const isA = keys['KeyA'] || keys['ArrowLeft'];
    const isD = keys['KeyD'] || keys['ArrowRight'];
    const isBrake = keys['Space'];
    const isShift = keys['ShiftLeft'] || keys['ShiftRight'] || state.nitro;

    const maxSpeed = isShift ? 42 : 28;
    const accel = isShift ? 18 : 12;

    if (isW) {
      state.speed += accel * dt;
      if (state.speed > maxSpeed) state.speed = maxSpeed;
    } else if (isS) {
      state.speed -= 10 * dt;
      if (state.speed < -10) state.speed = -10;
    } else {
      state.speed *= Math.pow(0.92, dt * 60);
    }

    if (isBrake) {
      state.speed *= Math.pow(0.75, dt * 60);
      playDriftScreech();
      // add skidmark
      if (Math.abs(state.speed) > 5) {
        state.skidmarks.push({ x: state.x, z: state.z, angle: state.angle, alpha: 1.0 });
      }
    }

    if (Math.abs(state.speed) > 0.5) {
      const turnFactor = (state.speed > 0 ? 1 : -1) * (1.8 / (1 + Math.abs(state.speed) * 0.05));
      if (isA) state.angle -= turnFactor * dt;
      if (isD) state.angle += turnFactor * dt;
    }

    state.x += Math.sin(state.angle) * state.speed * dt * 8;
    state.z += Math.cos(state.angle) * state.speed * dt * 8;

    // Engine pitch modulation
    if (engineOsc && audioCtx) {
      const targetFreq = 45 + Math.abs(state.speed) * 9;
      engineOsc.frequency.setValueAtTime(targetFreq, audioCtx.currentTime);
    }

    // Update HUD speed
    const kmh = Math.round(Math.abs(state.speed) * 6.5);
    document.getElementById('speedVal').innerText = kmh;
    state.gear = Math.max(1, Math.min(6, Math.floor(kmh / 35) + 1));
    document.getElementById('gearVal').innerText = 'SỐ ' + state.gear + (state.nitro ? ' [NITRO]' : ' (ZENTORNO)');

  } else {
    // Foot mode
    const isW = keys['KeyW'] || keys['ArrowUp'];
    const isS = keys['KeyS'] || keys['ArrowDown'];
    const isA = keys['KeyA'] || keys['ArrowLeft'];
    const isD = keys['KeyD'] || keys['ArrowRight'];
    const isShift = keys['ShiftLeft'];

    const footSpeed = isShift ? 14 : 7;
    let moveX = 0, moveZ = 0;
    if (isW) { moveX += Math.sin(state.angle); moveZ += Math.cos(state.angle); }
    if (isS) { moveX -= Math.sin(state.angle); moveZ -= Math.cos(state.angle); }
    if (isA) { moveX -= Math.cos(state.angle); moveZ += Math.sin(state.angle); }
    if (isD) { moveX += Math.cos(state.angle); moveZ -= Math.sin(state.angle); }

    const len = Math.hypot(moveX, moveZ);
    if (len > 0) {
      state.x += (moveX / len) * footSpeed * dt * 4;
      state.z += (moveZ / len) * footSpeed * dt * 4;
    }
    document.getElementById('speedVal').innerText = Math.round(len > 0 ? footSpeed : 0);
    document.getElementById('gearVal').innerText = isShift ? 'CHẠY BỘ (SPRINT)' : 'ĐI BỘ (WALK)';
  }

  // Bullets update
  for (let i = state.bullets.length - 1; i >= 0; i--) {
    const b = state.bullets[i];
    b.x += b.dx * dt * 30;
    b.z += b.dz * dt * 30;
    b.life--;
    if (b.life <= 0) state.bullets.splice(i, 1);
  }

  // --- Render 3D Perspective Projection ---
  renderScene();
  renderMinimap();

  requestAnimationFrame(gameLoop);
}

function renderScene() {
  ctx.save();
  ctx.clearRect(0, 0, W, H);

  // Background Sky gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  if (state.weather === 'SUNSET') {
    skyGrad.addColorStop(0, '#1a0b2e');
    skyGrad.addColorStop(0.4, '#4c1d95');
    skyGrad.addColorStop(0.65, '#f97316');
    skyGrad.addColorStop(1, '#0f172a');
  } else if (state.weather === 'NIGHT') {
    skyGrad.addColorStop(0, '#030712');
    skyGrad.addColorStop(0.6, '#0f172a');
    skyGrad.addColorStop(1, '#020617');
  } else {
    skyGrad.addColorStop(0, '#1e293b');
    skyGrad.addColorStop(0.7, '#334155');
    skyGrad.addColorStop(1, '#0f172a');
  }
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // Camera Settings
  const camDist = (state.cameraMode === 0) ? 90 : (state.cameraMode === 1 ? 160 : 25);
  const camHeight = (state.cameraMode === 2) ? 14 : 45;
  const camX = state.x - Math.sin(state.angle) * camDist;
  const camZ = state.z - Math.cos(state.angle) * camDist;
  const camY = camHeight;

  // Project function
  function project(wx, wy, wz) {
    const dx = wx - camX;
    const dy = wy - camY;
    const dz = wz - camZ;

    // Rotate into camera space
    const cosA = Math.cos(-state.angle);
    const sinA = Math.sin(-state.angle);
    const rx = dx * cosA - dz * sinA;
    const rz = dx * sinA + dz * cosA;

    if (rz <= 2) return null;
    const fov = 380;
    const sx = W / 2 + (rx / rz) * fov;
    const sy = H / 2 - (dy / rz) * fov;
    return { x: sx, y: sy, depth: rz };
  }

  // Ground Grid Roads & Sidewalks
  const groundSize = 1200;
  const gP1 = project(state.x - groundSize, 0, state.z - groundSize);
  const gP2 = project(state.x + groundSize, 0, state.z - groundSize);
  const gP3 = project(state.x + groundSize, 0, state.z + groundSize);
  const gP4 = project(state.x - groundSize, 0, state.z + groundSize);

  ctx.fillStyle = '#0a0f1d';
  ctx.beginPath();
  if (gP1 && gP2 && gP3 && gP4) {
    ctx.moveTo(gP1.x, gP1.y);
    ctx.lineTo(gP2.x, gP2.y);
    ctx.lineTo(gP3.x, gP3.y);
    ctx.lineTo(gP4.x, gP4.y);
    ctx.closePath();
    ctx.fill();
  }

  // Draw Asphalt Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1.5;
  for (let x = -800; x <= 800; x += 140) {
    const pA = project(x, 0, state.z - 600);
    const pB = project(x, 0, state.z + 600);
    if (pA && pB) {
      ctx.beginPath();
      ctx.moveTo(pA.x, pA.y);
      ctx.lineTo(pB.x, pB.y);
      ctx.stroke();
    }
  }

  // Draw Skidmarks
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.lineWidth = 4;
  for (let s of state.skidmarks) {
    const sp = project(s.x, 0, s.z);
    if (sp) {
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, 3, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // Headlight beams
  if (state.headlights && state.mode === 'CAR') {
    const hLeft = project(state.x + Math.cos(state.angle) * 8 + Math.sin(state.angle) * 120, 0, state.z - Math.sin(state.angle) * 8 + Math.cos(state.angle) * 120);
    const hRight = project(state.x - Math.cos(state.angle) * 8 + Math.sin(state.angle) * 120, 0, state.z + Math.sin(state.angle) * 8 + Math.cos(state.angle) * 120);
    const carP = project(state.x, 2, state.z);
    if (hLeft && hRight && carP) {
      ctx.fillStyle = 'rgba(255, 245, 180, 0.18)';
      ctx.beginPath();
      ctx.moveTo(carP.x, carP.y);
      ctx.lineTo(hLeft.x, hLeft.y);
      ctx.lineTo(hRight.x, hRight.y);
      ctx.closePath();
      ctx.fill();
    }
  }

  // Render 3D Buildings
  buildings.sort((a, b) => {
    const da = Math.hypot(a.x - camX, a.z - camZ);
    const db = Math.hypot(b.x - camX, b.z - camZ);
    return db - da;
  });

  for (let b of buildings) {
    const bP1 = project(b.x - b.w/2, 0, b.z - b.d/2);
    const bP2 = project(b.x + b.w/2, 0, b.z - b.d/2);
    const bP3 = project(b.x + b.w/2, 0, b.z + b.d/2);
    const bP4 = project(b.x - b.w/2, 0, b.z + b.d/2);

    const tP1 = project(b.x - b.w/2, b.h, b.z - b.d/2);
    const tP2 = project(b.x + b.w/2, b.h, b.z - b.d/2);
    const tP3 = project(b.x + b.w/2, b.h, b.z + b.d/2);
    const tP4 = project(b.x - b.w/2, b.h, b.z + b.d/2);

    if (bP1 && bP2 && tP2 && tP1) {
      // Wall
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.moveTo(bP1.x, bP1.y);
      ctx.lineTo(bP2.x, bP2.y);
      ctx.lineTo(tP2.x, tP2.y);
      ctx.lineTo(tP1.x, tP1.y);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(0, 245, 212, 0.3)';
      ctx.stroke();

      // Roof
      if (tP3 && tP4) {
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.moveTo(tP1.x, tP1.y);
        ctx.lineTo(tP2.x, tP2.y);
        ctx.lineTo(tP3.x, tP3.y);
        ctx.lineTo(tP4.x, tP4.y);
        ctx.closePath();
        ctx.fill();
      }
    }
  }

  // Draw Player / Vehicle
  const pCenter = project(state.x, 0, state.z);
  if (pCenter) {
    if (state.mode === 'CAR') {
      // Draw Supercar Zentorno
      ctx.save();
      ctx.translate(pCenter.x, pCenter.y);
      const carScale = Math.max(0.4, Math.min(2.5, 450 / pCenter.depth));
      ctx.scale(carScale, carScale);

      // Car shadow
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.beginPath();
      ctx.ellipse(0, 8, 28, 14, 0, 0, Math.PI * 2);
      ctx.fill();

      // Car Body (Gold and Cyan Cyber Zentorno)
      ctx.fillStyle = '#d97706';
      ctx.beginPath();
      ctx.roundRect(-24, -10, 48, 18, 6);
      ctx.fill();

      // Roof & Cockpit
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.roundRect(-14, -18, 28, 14, 4);
      ctx.fill();

      // Windshield
      ctx.fillStyle = '#00f5d4';
      ctx.fillRect(-10, -16, 20, 5);

      // Taillights
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(-22, -4, 4, 6);
      ctx.fillRect(18, -4, 4, 6);

      // Nitro exhaust flame
      if (state.nitro) {
        ctx.fillStyle = '#00f5d4';
        ctx.beginPath();
        ctx.arc(-26, -1, 7 + Math.random() * 4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

    } else {
      // Draw Pedestrian Character
      ctx.save();
      ctx.translate(pCenter.x, pCenter.y);
      const pScale = Math.max(0.4, Math.min(2.5, 450 / pCenter.depth));
      ctx.scale(pScale, pScale);

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath();
      ctx.ellipse(0, 0, 8, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Legs & Torso
      ctx.fillStyle = '#1e293b'; // Pants
      ctx.fillRect(-4, -12, 3, 12);
      ctx.fillRect(1, -12, 3, 12);

      ctx.fillStyle = '#00f5d4'; // Jacket
      ctx.fillRect(-6, -24, 12, 12);

      // Head
      ctx.fillStyle = '#fed7aa';
      ctx.beginPath();
      ctx.arc(0, -28, 5, 0, Math.PI * 2);
      ctx.fill();

      // Gun
      ctx.fillStyle = '#000';
      ctx.fillRect(4, -22, 10, 3);
      ctx.restore();
    }
  }

  // Draw Bullets & Tracers
  ctx.strokeStyle = '#ffd166';
  ctx.lineWidth = 2.5;
  for (let b of state.bullets) {
    const bp = project(b.x, 2, b.z);
    if (bp) {
      ctx.beginPath();
      ctx.arc(bp.x, bp.y, 2.5, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  ctx.restore();
}

function renderMinimap() {
  mapCtx.clearRect(0, 0, 130, 130);
  mapCtx.save();
  mapCtx.translate(65, 65);
  mapCtx.rotate(-state.angle);

  // Roads on minimap
  mapCtx.strokeStyle = 'rgba(255,255,255,0.2)';
  mapCtx.lineWidth = 4;
  for (let x = -400; x <= 400; x += 140) {
    const rx = (x - state.x) * 0.15;
    mapCtx.beginPath();
    mapCtx.moveTo(rx, -100);
    mapCtx.lineTo(rx, 100);
    mapCtx.stroke();
  }

  // Buildings on minimap
  mapCtx.fillStyle = 'rgba(0, 245, 212, 0.25)';
  for (let b of buildings) {
    const mx = (b.x - state.x) * 0.15;
    const mz = (b.z - state.z) * 0.15;
    if (Math.hypot(mx, mz) < 60) {
      mapCtx.fillRect(mx - 4, mz - 4, 8, 8);
    }
  }

  mapCtx.restore();

  // Player arrow (fixed in center)
  mapCtx.fillStyle = '#ffd166';
  mapCtx.beginPath();
  mapCtx.moveTo(65, 57);
  mapCtx.lineTo(60, 71);
  mapCtx.lineTo(65, 68);
  mapCtx.lineTo(70, 71);
  mapCtx.closePath();
  mapCtx.fill();
}

// Start game loop
requestAnimationFrame(gameLoop);
</script>
</body>
