name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tên phiên bản Release (ví dụ: v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Build FivePlay Mobile APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Keystores for Debug & Release Signing
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass android123 \
              -alias upload \
              -keypass android123 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=FivePlay Mobile,OU=Mobile,O=FivePlay,L=VN,S=VN,C=VN"
          fi

      - name: Ensure .env exists from .env.example
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Build Debug & Signed Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Prepare Release APK Files
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/app-debug.apk release-apks/FivePlay-Mobile-Debug.apk
          cp app/build/outputs/apk/release/app-release.apk release-apks/FivePlay-Mobile-Release-Signed.apk
          ls -lh release-apks/

      - name: Upload APK Artifacts (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: FivePlay-Mobile-APKs
          path: release-apks/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || format('v1.0.{0}', github.run_number) }}
          name: "FivePlay Mobile APK (${{ github.event.inputs.release_tag || format('v1.0.{0}', github.run_number) }})"
          body: |
            ## FivePlay Mobile - Chơi GTA 5 (fiveplay.lol) trên Điện Thoại Android
            ### File cài đặt APK:
            - **`FivePlay-Mobile-Release-Signed.apk`**: Bản chính thức đã ký chứng chỉ (khuyên dùng để cài lên điện thoại).
            - **`FivePlay-Mobile-Debug.apk`**: Bản thử nghiệm Debug.
            
            ### Tính năng bao gồm:
            - Con trỏ Chuột Mũi Tên PC thực thụ (rê chuột & chạm nhẹ để Click Chuột Trái) + Chế độ Khóa Tâm 3D 360°.
            - Đầy đủ hệ thống nút GTA 5 / FiveM: `WASD`, `Shift`, `Ctrl`, `Alt`, `Space`, `F`, `E`, `R`, `Q`, `G`, `X`, `C`, `V`, `N`, `1-5`, `F1-F8`, cụm phím mũi tên Điện Thoại GTA và Bàn Phím PC nổi.
          files: |
            release-apks/FivePlay-Mobile-Release-Signed.apk
            release-apks/FivePlay-Mobile-Debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
