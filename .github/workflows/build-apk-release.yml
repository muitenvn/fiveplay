name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tên phiên bản Release (ví dụ: v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Build FivePlay Mobile APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configure Android SDK Licenses
        run: |
          mkdir -p "${ANDROID_HOME}/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n89386a276086303fb4822856d694b37738e6e257" > "${ANDROID_HOME}/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "${ANDROID_HOME}/licenses/android-sdk-preview-license"
          echo -e "\n601085b94cd77f6b54b86eab642d4d50b26a4f6d" > "${ANDROID_HOME}/licenses/android-googletv-license"
          echo -e "\n33b6a2b64607f11b759f32049dff4ef5c1202110" > "${ANDROID_HOME}/licenses/google-gdk-license"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Keystores for Debug & Release Signing
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass android123 \
              -alias upload \
              -keypass android123 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=FivePlay Mobile,OU=Mobile,O=FivePlay,L=VN,S=VN,C=VN"
          fi

      - name: Ensure .env exists from .env.example
        run: |
          touch .env
          if [ -f ".env.example" ]; then
            cat .env.example >> .env
          fi

      - name: Build Debug & Signed Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: |
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug assembleRelease --no-daemon --stacktrace
          fi

      - name: Prepare Release APK Files
        run: |
          mkdir -p release-apks
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then cp "$DEBUG_APK" release-apks/FivePlay-Mobile-Debug.apk; fi
          if [ -n "$RELEASE_APK" ]; then cp "$RELEASE_APK" release-apks/FivePlay-Mobile-Release-Signed.apk; fi
          ls -lh release-apks/

      - name: Upload APK Artifacts (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: FivePlay-Mobile-APKs
          path: release-apks/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || format('v1.0.{0}', github.run_number) }}
          name: "FivePlay Mobile APK (${{ github.event.inputs.release_tag || format('v1.0.{0}', github.run_number) }})"
          body: |
            ## FivePlay Mobile - Trình duyệt chơi GTA 5 trên fiveplay.lol
            ### File cài đặt APK:
            - **`FivePlay-Mobile-Release-Signed.apk`**: Bản phát hành chính thức đã ký chứng chỉ (Khuyên dùng cài đặt trực tiếp lên điện thoại Android).
            - **`FivePlay-Mobile-Debug.apk`**: Bản thử nghiệm Debug.
            
            ### Tính năng nổi bật:
            - Kết nối trực tiếp máy chủ **https://fiveplay.lol** với Chrome Desktop User-Agent và bộ đệm WebGL tăng tốc độ khung hình.
            - Con trỏ Chuột Mũi Tên PC thực thụ (di chuyển & chạm nhẹ để Click Chuột Trái) + Chế độ Khóa Tâm 3D 360°.
            - Đầy đủ hệ thống phím nóng GTA 5: `WASD`, `Shift`, `Ctrl`, `Alt`, `Space`, `F`, `E`, `R`, `Q`, `G`, `X`, `C`, `V`, `N`, `1-5`, `F1-F8`, phím điều hướng Điện thoại GTA và Bàn phím PC nổi.
          files: |
            release-apks/FivePlay-Mobile-Release-Signed.apk
            release-apks/FivePlay-Mobile-Debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
